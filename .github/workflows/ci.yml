name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the package supports, and the newest two (requires-python and the classifiers).
        include:
          - python: "3.9"
            os: ubuntu-24.04 # the newest runner image that still has a Python 3.9
          - python: "3.13"
            os: ubuntu-latest
          - python: "3.14"
            os: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }} # the Python set up below, never one uv downloads
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.7
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - name: mypy --strict (the package and the examples)
        run: uv run --frozen mypy

  build:
    name: Build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.7
      - run: uv build --out-dir dist
      - name: The wheel installs and imports
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import verifyinboxes; print(verifyinboxes.__version__)"
