name: Smoke

# Every week (and on demand), the released code against the live API: the account, one check and a two-address list
# (tests/test_smoke.py). It needs the repository secret VERIFYINBOXES_SMOKE_API_KEY, a key of an organisation with
# a few credits; without it, it says so and succeeds.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Against the live API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFYINBOXES_SMOKE_API_KEY: ${{ secrets.VERIFYINBOXES_SMOKE_API_KEY }}
      UV_PYTHON: "3.13"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Without the secret there is nothing to run
        if: env.VERIFYINBOXES_SMOKE_API_KEY == ''
        run: echo "::notice::VERIFYINBOXES_SMOKE_API_KEY is not set, so the smoke test did not run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.VERIFYINBOXES_SMOKE_API_KEY != ''
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.VERIFYINBOXES_SMOKE_API_KEY != ''
        with:
          python-version: "3.13"
      - if: env.VERIFYINBOXES_SMOKE_API_KEY != ''
        run: python -m pip install uv==0.11.7
      - if: env.VERIFYINBOXES_SMOKE_API_KEY != ''
        run: uv sync --frozen
      - if: env.VERIFYINBOXES_SMOKE_API_KEY != ''
        run: uv run --frozen pytest -q -rs tests/test_smoke.py
