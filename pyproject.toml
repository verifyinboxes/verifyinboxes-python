[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "verifyinboxes"
version = "0.1.0"
description = "The official Python library for the VerifyInboxes API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VerifyInboxes", email = "developers@verifyinboxes.com" }]
keywords = ["verifyinboxes", "email", "email verification", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[dependency-groups]
dev = ["pytest==8.4.2", "mypy==1.19.1"]

[project.urls]
Homepage = "https://verifyinboxes.com"
Repository = "https://github.com/verifyinboxes/verifyinboxes-python"
Issues = "https://github.com/verifyinboxes/verifyinboxes-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/verifyinboxes"]

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
strict = true
python_version = "3.9"
files = ["src/verifyinboxes", "examples"]

[[tool.mypy.overrides]]
# httpx's async backend: read only through httpx. Its newest releases (for Python 3.10 and later) use syntax newer than
# the Python 3.9 this check targets.
module = ["anyio", "anyio.*"]
follow_imports = "skip"
